name: Ecosystem Manager
repo: https://github.com/WindToFly/OpencodeDesktopPluginManager
tagline: One switchboard for 161 official and community OpenCode plugins
description: Browse 39 official and 122 awesome-opencode community plugins from one tool, slash command, or local dashboard. Check descriptions, V1/V2 compatibility and npm availability, toggle guarded installs, and check or apply plugin updates, including the manager itself.
scope:
  - global
tags:
  - plugins
  - manager
  - dashboard
  - configuration
  - updates
min_version: 2.0.0
homepage: https://github.com/WindToFly/OpencodeDesktopPluginManager#readme
installation: |
  ```sh
  opencode plugin add opencode-ecosystem-manager
  ```

  Then run `/ecosystem ui` to open the dashboard, `/ecosystem list` to see the catalog in the terminal, or `/ecosystem updates` to check for plugin upgrades (the manager is included). Use `/ecosystem upgrade [name...]` to apply them.
