name: Ecosystem Manager
repo: https://github.com/WindToFly/OpencodeDesktopPluginManager
tagline: One switchboard for 39 OpenCode plugins
description: Browse the OpenCode plugin ecosystem from a tool, slash command, or local dashboard. Check V1/V2 compatibility and npm availability, then install or uninstall plugins with one toggle while only touching the ones you selected.
scope:
  - global
tags:
  - plugins
  - manager
  - dashboard
  - configuration
min_version: 2.0.0
homepage: https://github.com/WindToFly/OpencodeDesktopPluginManager#readme
installation: |
  ```sh
  opencode plugin add opencode-ecosystem-manager
  ```

  Then run `/ecosystem ui` to open the dashboard, or `/ecosystem list` to see the catalog in the terminal.
